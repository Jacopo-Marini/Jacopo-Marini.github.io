name: Deploy site

# Publishes the repo's static files to the gh-pages branch, which GitHub Pages serves.
# No build step: edit index.html / style.css, push to main, and it's live in about a minute.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage site files
        run: |
          mkdir _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' --exclude='README.md' --exclude='.gitignore' ./ _site/
          touch _site/.nojekyll
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
